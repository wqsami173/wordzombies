<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Typing Survival</title>
    <style>
        /* =========================================================
           GLOBAL & LAYOUT
           ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050807;
            color: white;
            font-family: 'Courier New', Arial, sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* =========================================================
           HOUSE & VISUAL ELEMENTS
           ========================================================= */
        #house {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 170px;
            height: 170px;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 15px 12px rgba(0,0,0,.65));
        }

        .house-shadow {
            position: absolute;
            width: 160px;
            height: 38px;
            left: 5px;
            bottom: 5px;
            background: rgba(0,0,0,.7);
            border-radius: 50%;
            filter: blur(7px);
        }

        .house-body {
            position: absolute;
            width: 115px;
            height: 82px;
            left: 27px;
            top: 56px;
            background: repeating-linear-gradient(0deg, #765033 0px, #765033 8px, #68442d 9px, #68442d 10px);
            border: 4px solid #352218;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,.05), inset 0 -15px 22px rgba(0,0,0,.28), 0 8px 15px rgba(0,0,0,.55);
        }

        .wood-beam {
            position: absolute;
            width: 8px;
            height: 82px;
            top: 0;
            background: linear-gradient(90deg, #2e1c14, #52321f, #2b1a13);
            box-shadow: 2px 0 2px rgba(0,0,0,.4);
        }
        .beam-left { left: 8px; }
        .beam-right { right: 8px; }

        .house-roof {
            position: absolute;
            width: 150px;
            height: 82px;
            left: 10px;
            top: 7px;
            background: repeating-linear-gradient(135deg, #3c211c 0px, #3c211c 9px, #512b24 10px, #512b24 13px);
            clip-path: polygon(50% 0%, 100% 72%, 95% 88%, 5% 88%, 0% 72%);
            filter: drop-shadow(0 7px 5px rgba(0,0,0,.7));
            z-index: 3;
        }

        .roof-line {
            position: absolute;
            width: 157px;
            height: 9px;
            left: -4px;
            bottom: 5px;
            background: #241512;
            transform: skewX(-28deg);
        }

        .chimney {
            position: absolute;
            width: 21px;
            height: 39px;
            right: 21px;
            top: 5px;
            background: repeating-linear-gradient(0deg, #5a3a32 0px, #5a3a32 8px, #39231f 9px, #39231f 10px);
            border: 3px solid #281714;
            z-index: 4;
        }

        .chimney-smoke {
            position: absolute;
            width: 17px;
            height: 17px;
            right: 23px;
            top: -17px;
            border-radius: 50%;
            background: rgba(140,140,140,.22);
            filter: blur(5px);
            animation: smoke 3s infinite ease-in-out;
        }
        @keyframes smoke {
            0% { transform: translate(0,10px) scale(.7); opacity: .15; }
            50% { transform: translate(8px,-8px) scale(1.35); opacity: .45; }
            100% { transform: translate(17px,-28px) scale(1.8); opacity: 0; }
        }

        .window {
            position: absolute;
            width: 30px;
            height: 27px;
            top: 19px;
            background: #211914;
            border: 4px solid #38251a;
            box-shadow: 0 0 12px rgba(93,180,220,.35), inset 0 0 8px rgba(0,0,0,.7);
            overflow: hidden;
        }
        .window.left { left: 8px; }
        .window.right { right: 8px; }

        .window .glass {
            position: absolute;
            inset: 3px;
            background: radial-gradient(circle at 30% 30%, #f4ffe7, #b9df9c 38%, #4d7250 75%, #263c2a);
            box-shadow: inset 0 0 8px rgba(200,255,190,.7);
            animation: windowGlow 2.5s infinite ease-in-out;
        }
        @keyframes windowGlow { 0%,100%{filter:brightness(.75);} 50%{filter:brightness(1.15);} }

        .window span, .window i {
            position: absolute;
            background: #38251c;
            z-index: 2;
        }
        .window span { width: 3px; height: 100%; left: 50%; transform: translateX(-50%); }
        .window i { height: 3px; width: 100%; top: 50%; transform: translateY(-50%); }

        .attic-window {
            position: absolute;
            width: 26px;
            height: 21px;
            left: 45px;
            top: -27px;
            background: #25201d;
            border: 3px solid #1b1310;
            border-radius: 50% 50% 0 0;
            overflow: hidden;
        }
        .attic-window span { position: absolute; inset: 3px; background: #73a9b8; box-shadow: inset 0 0 8px #bdefff; }
        .attic-window i { position: absolute; width: 3px; height: 100%; left: 50%; background: #302019; }

        .door {
            position: absolute;
            width: 32px;
            height: 55px;
            left: 41px;
            bottom: 0;
            background: repeating-linear-gradient(90deg, #392116 0px, #392116 7px, #4b2d1d 8px, #4b2d1d 10px);
            border: 4px solid #24150f;
            box-shadow: inset 0 0 8px rgba(0,0,0,.6), 0 0 3px #000;
        }
        .door-panel { position: absolute; width: 16px; height: 16px; left: 4px; top: 6px; border: 2px solid #20130e; background: rgba(0,0,0,.15); }
        .door-handle { position: absolute; width: 5px; height: 5px; right: 4px; top: 30px; background: #d0a94c; border-radius: 50%; box-shadow: 0 0 5px #e5c866; }
        .barricade {
            position: absolute; width: 42px; height: 7px; left: -10px;
            background: linear-gradient(180deg, #71492d, #3b2417);
            border: 2px solid #28170f; transform: rotate(-8deg);
            box-shadow: 0 2px 2px rgba(0,0,0,.5);
        }
        .b1 { top: 15px; }
        .b2 { top: 33px; transform: rotate(7deg); }
        .barricade::after { content: "•        •"; position: absolute; left: 7px; top: -4px; color: #aaa28b; font-size: 10px; }

        .porch {
            position: absolute; width: 132px; height: 18px; left: 19px; bottom: 20px;
            background: repeating-linear-gradient(90deg, #523521 0px, #523521 11px, #382216 12px, #382216 14px);
            border: 3px solid #281912; z-index: 4;
        }
        .porch-step { position: absolute; width: 142px; height: 9px; left: -8px; bottom: -10px; background: #392419; border: 2px solid #21140f; }
        .porch-post { position: absolute; width: 7px; height: 29px; bottom: 0; background: linear-gradient(90deg, #332016, #67432a, #302016); border: 1px solid #24150f; }
        .left-post { left: 5px; }
        .right-post { right: 5px; }

        /* =========================================================
           HUD, TYPOGRAPHY, UI
           ========================================================= */
        #hud {
            position: fixed; top: 18px; left: 18px; z-index: 10; pointer-events: none;
            font-family: 'Courier New', monospace;
        }
        .title {
            font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #e33; margin-bottom: 12px;
            text-shadow: 0 0 10px #900, 0 0 25px rgba(150,0,0,.4);
        }
        .stat { font-size: 17px; margin: 6px 0; text-shadow: 2px 2px 3px #000; }
        #healthBox {
            width: 230px; height: 18px; background: #222; border: 2px solid #ddd; border-radius: 5px;
            overflow: hidden; margin-top: 4px; box-shadow: 0 0 10px rgba(0,0,0,.6);
        }
        #health { width: 100%; height: 100%; background: linear-gradient(90deg, #7d1111, #e12d2d, #ff5555); transition: .15s; }

        #wpmMeter {
            position: fixed; top: 20px; right: 24px; z-index: 15; background: rgba(0,0,0,.65);
            padding: 8px 18px; border-radius: 30px; backdrop-filter: blur(4px); border: 1px solid #3a4a4a;
            box-shadow: 0 0 15px rgba(0,0,0,.7); pointer-events: none; text-align: center;
        }
        #wpmMeter .label { font-size: 12px; color: #8aa; letter-spacing: 1px; }
        #wpmMeter .value { font-size: 28px; font-weight: bold; color: #b5f0b5; line-height: 1.1; }
        #wpmMeter .sub { font-size: 11px; color: #5a7a7a; margin-top: 2px; }

        #help { position: fixed; bottom: 18px; right: 20px; z-index: 10; color: #777; text-align: right; font-size: 13px; line-height: 1.6; pointer-events: none; }

        #typingFlash {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 15px; font-weight: bold; color: #65e879; opacity: 0; pointer-events: none;
            transition: .15s; z-index: 20; text-shadow: 0 0 10px #000;
        }

        /* =========================================================
           START SCREEN
           ========================================================= */
        #screen {
            position: fixed; inset: 0; z-index: 30;
            background: radial-gradient(circle, rgba(90,20,20,.25), rgba(0,0,0,.96));
            display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center;
        }
        #screen h1 { font-size: 64px; color: #e33; letter-spacing: 5px; text-shadow: 0 0 15px #700, 0 0 40px #300; margin-bottom: 15px; }
        #screen p { color: #aaa; font-size: 18px; line-height: 1.7; margin-bottom: 25px; }
        button {
            padding: 15px 38px; border: 0; border-radius: 8px; background: #c92727; color: white;
            font-size: 19px; font-weight: bold; cursor: pointer; transition: .2s;
            box-shadow: 0 5px 20px rgba(120,0,0,.4); font-family: 'Courier New', monospace;
        }
        button:hover { background: #ed3838; transform: scale(1.04); box-shadow: 0 5px 30px rgba(180,0,0,.6); }

        /* =========================================================
           ZOMBIE CHARACTER (CSS ART)
           ========================================================= */
        .zombie-character {
            position: fixed;
            width: 38px;
            height: 82px;
            transform-origin: 50% 100%;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,.7));
            animation: zombieIdle 1.7s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }
        .zombie-character.walk { animation: zombieWalk .55s infinite alternate; }
        .zombie-character.hit { animation: zombieHit .35s ease; }
        .zombie-character.dead { animation: zombieDeath 1s forwards; }

        .zombie-head { position: absolute; width: 24px; height: 26px; left: 8px; top: 2px; background: radial-gradient(ellipse at 40% 25%, #879487 0%, #657064 45%, #3e4841 100%); border-radius: 48% 45% 42% 48%; transform: rotate(-3deg); border: 1px solid #29312c; box-shadow: inset -2px -2px 3px rgba(0,0,0,.35), inset 1px 0 2px rgba(255,255,255,.08); }
        .zombie-scalp { position: absolute; width: 16px; height: 9px; left: 4px; top: -2px; background: #747e73; border-radius: 70% 60% 30% 30%; border-bottom: 1px solid #3b443d; }
        .zombie-wound { position: absolute; background: #30201f; border-radius: 50%; }
        .zombie-wound.w1 { width: 4px; height: 2px; top: 2px; left: 2px; transform: rotate(-18deg); }
        .zombie-wound.w2 { width: 3px; height: 1px; top: 6px; right: 3px; transform: rotate(20deg); }
        .zombie-wound.w3 { width: 2px; height: 2px; top: 1px; right: 6px; }
        .zombie-ear { position: absolute; width: 5px; height: 8px; background: #657064; border: 1px solid #303932; border-radius: 50%; }
        .zombie-ear.left { left: -3px; top: 9px; }
        .zombie-ear.right { right: -3px; top: 10px; }
        .zombie-eye { position: absolute; width: 7px; height: 5px; top: 9px; background: #202722; border-radius: 50% 45% 45% 50%; border: 1px solid #303831; overflow: hidden; }
        .zombie-eye.left { left: 3px; transform: rotate(8deg); }
        .zombie-eye.right { right: 3px; transform: rotate(-8deg); }
        .zombie-eyeball { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #d7d0a5; top: 1px; left: 2px; box-shadow: 0 0 2px rgba(220,200,130,.3); animation: eyeMove 4s infinite; }
        .zombie-pupil { position: absolute; width: 2px; height: 3px; background: #080909; border-radius: 50%; left: 1px; top: 1px; }
        .zombie-brow { position: absolute; width: 8px; height: 2px; background: #343c36; border-radius: 50%; top: 8px; }
        .zombie-brow.left { left: 2px; transform: rotate(-10deg); }
        .zombie-brow.right { right: 3px; transform: rotate(12deg); }
        .zombie-nose { position: absolute; width: 6px; height: 8px; left: 9px; top: 12px; border-left: 1px solid #4b554d; border-bottom: 1px solid #39423b; border-radius: 35%; transform: rotate(-5deg); }
        .zombie-mouth { position: absolute; width: 16px; height: 8px; left: 4px; bottom: 4px; background: #1c1111; border: 1px solid #343b35; border-radius: 15% 15% 50% 50%; overflow: hidden; transform: rotate(2deg); }
        .zombie-tongue { position: absolute; width: 8px; height: 3px; background: #6f3c3c; border-radius: 50%; bottom: -1px; left: 4px; }
        .zombie-tooth { position: absolute; width: 2px; height: 3px; background: #ddd5a6; border-radius: 1px; top: 1px; }
        .zombie-tooth.t1 { left: 1px; } .zombie-tooth.t2 { left: 3px; } .zombie-tooth.t3 { left: 6px; } .zombie-tooth.t4 { left: 8px; } .zombie-tooth.t5 { left: 11px; } .zombie-tooth.t6 { left: 13px; }
        .zombie-neck { position: absolute; width: 10px; height: 10px; left: 14px; top: 24px; background: #3e4841; border-radius: 2px; border: 1px solid #303832; z-index: -1; }
        .zombie-torso { position: absolute; width: 20px; height: 29px; left: 9px; top: 29px; background: linear-gradient(100deg, #252c29, #414942 45%, #202522); border: 1px solid #171c19; border-radius: 4px 4px 2px 2px; transform: rotate(2deg); box-shadow: inset 2px 0 2px rgba(255,255,255,.04), inset -2px 0 2px rgba(0,0,0,.4); }
        .zombie-arm { position: absolute; width: 8px; height: 27px; background: linear-gradient(90deg, #3e4841, #657064, #3e4841); border: 1px solid #303831; border-radius: 4px; transform-origin: top center; }
        .zombie-arm.left { left: 3px; top: 30px; transform: rotate(16deg); animation: leftArm 1.7s ease-in-out infinite; }
        .zombie-arm.right { right: 3px; top: 30px; transform: rotate(-28deg); animation: rightArm 1.7s ease-in-out infinite; }
        .zombie-hand { position: absolute; width: 8px; height: 7px; background: #657064; border: 1px solid #303831; border-radius: 45%; bottom: -5px; left: -1px; }
        .zombie-leg { position: absolute; width: 8px; height: 26px; top: 56px; background: linear-gradient(90deg, #191d1b, #353a36, #171a18); border: 1px solid #101311; border-radius: 2px; }
        .zombie-leg.left { left: 10px; transform: rotate(5deg); }
        .zombie-leg.right { right: 10px; transform: rotate(-5deg); }
        .zombie-shoe { position: absolute; width: 13px; height: 6px; background: linear-gradient(#171a18, #343833); border: 1px solid #0b0d0c; border-radius: 3px 4px 2px 2px; bottom: -3px; }
        .zombie-shoe.left { left: -3px; transform: rotate(-5deg); }
        .zombie-shoe.right { right: -3px; transform: rotate(5deg); }

        .zombie-word-label {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,.85); border: 2px solid #65e879; border-radius: 3px;
            padding: 4px 8px; font-size: 12px; font-weight: bold; color: #fff; white-space: nowrap; pointer-events: none;
            box-shadow: 0 0 10px rgba(101,232,121,.5);
            z-index: 9999 !important;
        }
        .zombie-word-label .typed { color: #65e879; }
        .zombie-word-label .remaining { color: #fff; }

        /* Animations */
        @keyframes zombieIdle { 0%,100%{ transform: translateY(0) rotate(0deg); } 50%{ transform: translateY(-1px) rotate(-1deg); } }
        @keyframes zombieWalk { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-2px) rotate(2deg); } }
        @keyframes zombieHit { 0%{ transform: translateX(0);} 25%{ transform: translateX(-2px) rotate(-5deg);} 50%{ transform: translateX(2px) rotate(5deg);} 75%{ transform: translateX(-1px);} 100%{ transform: translateX(0);} }
        @keyframes zombieDeath { 0%{ transform: rotate(0) translateY(0); opacity:1;} 100%{ transform: rotate(90deg) translateY(12px); opacity:0;} }
        @keyframes leftArm { 0%,100%{ transform: rotate(16deg);} 50%{ transform: rotate(11deg);} }
        @keyframes rightArm { 0%,100%{ transform: rotate(-28deg);} 50%{ transform: rotate(-34deg);} }
        @keyframes eyeMove { 0%,45%,100%{ transform: translateX(0);} 50%,70%{ transform: translateX(1px);} }

        /* Z-index management for zombie vs house */
        .zombie-character.behind-house { z-index: 4; }
        .zombie-character.front-house { z-index: 6; }

        /* Responsive */
        @media (max-width:600px) {
            .title { font-size: 18px; }
            .stat { font-size: 14px; }
            #healthBox { width: 170px; }
            #screen h1 { font-size: 38px; }
            #screen p { font-size: 14px; }
            #house { transform: translate(-50%,-50%) scale(.82); }
            .zombie-character { transform: scale(.5); transform-origin: 50% 100%; }
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="zombieContainer"></div>

    <div id="hud">
        <div class="title">ZOMBIE SURVIVAL</div>
        <div class="stat">❤️ Health</div>
        <div id="healthBox"><div id="health"></div></div>
        <div class="stat">🧟 Wave: <span id="wave">1</span></div>
        <div class="stat">☠️ Kills: <span id="kills">0</span></div>
        <div class="stat">⭐ Score: <span id="score">0</span></div>
    </div>

    <div id="house">
        <div class="house-shadow"></div>
        <div class="house-roof">
            <div class="roof-line"></div>
            <div class="chimney"></div>
            <div class="chimney-smoke"></div>
        </div>
        <div class="house-body">
            <div class="attic-window"><span></span><i></i></div>
            <div class="window left"><div class="glass"></div><span></span><i></i></div>
            <div class="window right"><div class="glass"></div><span></span><i></i></div>
            <div class="door">
                <div class="door-panel"></div>
                <div class="door-handle"></div>
                <div class="barricade b1"></div>
                <div class="barricade b2"></div>
            </div>
            <div class="wood-beam beam-left"></div>
            <div class="wood-beam beam-right"></div>
        </div>
        <div class="porch">
            <div class="porch-step"></div>
            <div class="porch-post left-post"></div>
            <div class="porch-post right-post"></div>
        </div>
    </div>

    <div id="wpmMeter">
        <div class="label">⚡ WPM</div>
        <div class="value" id="wpmDisplay">0</div>
        <div class="sub">words / min</div>
    </div>

    <div id="typingFlash"></div>
    <div id="help">TYPE THE WORDS ON THE ZOMBIES</div>

    <div id="screen">
        <h1>ZOMBIE SURVIVAL</h1>
        <p>🧟 Zombies are coming...<br>Type any word you see above a zombie<br>and kill it.</p>
        <button id="start">START SURVIVAL</button>
    </div>

    <script>
        (function(){
            // Canvas & Game State
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');
            let W, H;
            let yardDecor = [];
            let fireflies = [];
            let yardInitialized = false;

            // Game variables
            let player;
            let zombies = [];
            let particles = [];
            let bloodDrops = [];
            let running = false;
            let wave = 1;
            let kills = 0;
            let score = 0;
            let waveTimer = 0;
            let spawnTimer = 0;
            let lastTime = 0;
            let typing = "";
            let typingTarget = null;
            let zombieElements = new Map();

            // WPM
            let wpm = 0;
            let wordsCompleted = 0;
            let wpmStartTime = 0;

            // Word lists
            const easyWords = ["RUN","DEAD","BITE","HELP","DARK","BLOOD","NIGHT","FAST","FEAR","ZOMBIE","FIRE","KILL","DIE","SAFE","TRAP","FLESH","BONE","ROT","CRAWL","SCREAM","HIDE","GUN","SHOT","KNIFE","AXE","CLAW","TEETH","HORDE","SWARM","INFECT","VIRUS","PLAGUE","CURE","TOXIC","WASTE","ASH","SMOKE","BURN","FLAME","TORCH","LIGHT","SHADOW","ECHO","SILENT","STALK","HUNT","PREY","LURK","GROAN","MOAN","HOWL","SHRIEK","WHISPER","PANIC","CHAOS","RIOT","LOOT","STEAL","GRAB","FLEE","DASH","SPRINT","RACE","FALL","CRASH","SMASH","BREAK","DEFEND","GUARD","WATCH","SEARCH","SCAVENGE","SHELTER","BUNKER","CELLAR","ATTIC","ROOFTOP","ALLEY","TUNNEL","SEWER","BRIDGE","GATE","FENCE","WALL","LOCK","CHAIN","SPIKE","BLADE","MACHETE","BAT","CROWBAR","HAMMER","SHOVEL","PICK","SLEDGE","CHAINSAW"];
            const hardWords = ["APOCALYPSE","HEADSHOT","NIGHTMARE","SURVIVOR","INFECTION","QUARANTINE","ABANDONED","UNDEAD","OUTBREAK","GRAVEYARD","DESOLATION","INFECTED","ARMAGEDDON","DECAY","WITHERED","CORPSE","CARCASS","REMAINS","SKELETON","SKULL","MUTATION","MUTANT","ABOMINATION","MONSTER","CREATURE","DEMON","GHOUL","WRAITH","SPECTER","PHANTOM","OBLIVION","EXTINCTION","DEVASTATION","RUIN","RUBBLE","WRECKAGE","DEBRIS","PESTILENCE","CONTAGION","EPIDEMIC","PANDEMIC","MALADY","DISEASE","HEMORRHAGE","MUTILATE","BUTCHER","SLAUGHTER","MASSACRE","CARNAGE","BLOODSHED","ONSLAUGHT","BOMBARD","ABYSS","DARKNESS","BLACKOUT","MIDNIGHT","TWILIGHT","STORM","THUNDER","LIGHTNING","TEMPEST","WHIRLWIND","MAELSTROM","FAMINE","RAVENOUS","DEVOUR","CONSUME","MANGLE","FEROCIOUS","VICIOUS","SINISTER","OMINOUS","HOPELESS","DESPERATE","VULNERABLE","FORSAKEN","FORGOTTEN","DAMNED","CURSED","DOOMED","CONDEMNED","ERADICATED","PURGED","WASTELAND","DEADZONE","FROZEN","GLACIAL","MADNESS","INSANITY","HYSTERIA","PARANOIA","DELIRIUM","TRAUMA","ANGUISH","AGONY","TORMENT","TORTURE","SUFFERING","MISERY","SORROW","GRIEF","SHUDDER","ESCAPE","SURVIVE","ENDURE","PERSEVERE","RESIST","STRUGGLE","CONFLICT","WAR","DESTROY","OBLITERATE","INCINERATE","EXPLODE","SHOCKWAVE","COLLISION"];

            function getWord() {
                const list = wave < 3 ? easyWords : hardWords;
                const available = list.filter(word => !zombies.some(z => !z.dead && z.word === word));
                if (available.length > 0) return available[Math.floor(Math.random() * available.length)];
                return list[Math.floor(Math.random() * list.length)];
            }

            // Resize
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                yardInitialized = false;
            }
            window.addEventListener('resize', resize);
            resize();

            // Yard initialization
            function initYardDecor() {
                yardDecor = [];
                fireflies = [];
                for (let i = 0; i < 900; i++) {
                    const x = Math.random() * W, y = Math.random() * H;
                    const dx = x - W/2, dy = y - H/2;
                    if (Math.sqrt(dx*dx + dy*dy) < 145) continue;
                    yardDecor.push({ type: "grass", x, y, h: 3 + Math.random()*8, lean: (Math.random()-.5)*5 });
                }
                const graves = [[70,100],[160,155],[270,85],[365,140],[W-70,105],[W-160,165],[W-275,90],[W-370,145],[65,H-120],[165,H-75],[275,H-130],[380,H-80],[W-65,H-115],[W-170,H-75],[W-280,H-130],[W-390,H-80],[110,H/2-220],[W-110,H/2-220],[100,H/2+205],[W-100,H/2+205]];
                graves.forEach(p => {
                    yardDecor.push({ type: "grave", x: p[0], y: p[1], scale: .72 + Math.random()*.35, rot: (Math.random()-.5)*.12, cracked: Math.random()>.35, cross: Math.random()>.72, tilt: (Math.random()-.5)*.1 });
                });
                for (let i = 0; i < 55; i++) {
                    const x = Math.random()*W, y = Math.random()*H;
                    const dx = x-W/2, dy = y-H/2;
                    if (Math.sqrt(dx*dx+dy*dy) < 150) continue;
                    yardDecor.push({ type: "rock", x, y, s: 2 + Math.random()*6 });
                }
                for (let i = 0; i < 35; i++) yardDecor.push({ type: "dirt", x: Math.random()*W, y: Math.random()*H, rx: 15+Math.random()*50, ry: 5+Math.random()*17 });
                const trees = [[40,145,1.15],[W-45,145,1.25],[50,H-65,.9],[W-50,H-70,1.05],[270,55,.7],[W-270,60,.72]];
                trees.forEach(t => yardDecor.push({ type: "tree", x: t[0], y: t[1], s: t[2] }));
                for (let i = 0; i < 10; i++) yardDecor.push({ type: "fence", x: 20+i*38, y: H/2-250, flip: 0 });
                for (let i = 0; i < 10; i++) yardDecor.push({ type: "fence", x: W-20-i*38, y: H/2-250, flip: 1 });
                for (let i = 0; i < 18; i++) yardDecor.push({ type: "blood", x: Math.random()*W, y: Math.random()*H, s: 3+Math.random()*10, rot: Math.random()*Math.PI });
                for (let i = 0; i < 22; i++) fireflies.push({ x: Math.random()*W, y: Math.random()*H, phase: Math.random()*Math.PI*2, speed: .4+Math.random()*.8 });
                yardInitialized = true;
            }

            // Drawing functions
            function drawBackground() {
                if (!yardInitialized) initYardDecor();
                const grass = ctx.createLinearGradient(0,0,0,H);
                grass.addColorStop(0,"#111a14"); grass.addColorStop(.45,"#182119"); grass.addColorStop(1,"#090e0b");
                ctx.fillStyle = grass; ctx.fillRect(0,0,W,H);

                for (const d of yardDecor) {
                    if (d.type === "dirt") { ctx.save(); ctx.translate(d.x,d.y); ctx.fillStyle="rgba(48,34,25,.62)"; ctx.beginPath(); ctx.ellipse(0,0,d.rx,d.ry,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
                    else if (d.type === "blood") { ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.rot); ctx.fillStyle="rgba(95,15,15,.42)"; ctx.beginPath(); ctx.ellipse(0,0,d.s*1.7,d.s*.6,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle="rgba(140,20,20,.28)"; ctx.beginPath(); ctx.arc(d.s,-d.s*.4,d.s*.35,0,Math.PI*2); ctx.fill(); ctx.restore(); }
                    else if (d.type === "grass") { ctx.save(); ctx.translate(d.x,d.y); ctx.strokeStyle="rgba(67,94,59,.58)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(d.lean,-d.h); ctx.moveTo(1,0); ctx.lineTo(-3+d.lean,-d.h*.7); ctx.moveTo(3,0); ctx.lineTo(6+d.lean,-d.h*.55); ctx.stroke(); ctx.restore(); }
                    else if (d.type === "rock") { ctx.save(); ctx.translate(d.x,d.y); ctx.fillStyle="#242a26"; ctx.beginPath(); ctx.ellipse(0,0,d.s*1.6,d.s,-.2,0,Math.PI*2); ctx.fill(); ctx.fillStyle="rgba(140,150,135,.13)"; ctx.beginPath(); ctx.ellipse(-d.s*.35,-d.s*.3,d.s*.6,d.s*.25,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
                    else if (d.type === "tree") drawDeadTree(d.x,d.y,d.s);
                    else if (d.type === "grave") drawGrave(d);
                    else if (d.type === "fence") drawFence(d.x,d.y,d.flip);
                }

                ctx.save(); ctx.fillStyle="rgba(30,24,20,.38)"; ctx.beginPath(); ctx.ellipse(W/2,H/2+75,180,68,0,0,Math.PI*2); ctx.fill(); ctx.restore();

                const now = performance.now()/1000;
                for (const f of fireflies) {
                    const alpha = .25 + (Math.sin(now*f.speed+f.phase)+1)*.3;
                    ctx.fillStyle = `rgba(175,230,130,${alpha})`; ctx.shadowColor="rgba(150,230,100,.7)"; ctx.shadowBlur=8;
                    ctx.beginPath(); ctx.arc(f.x,f.y,1.5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
                }
                const fog = ctx.createRadialGradient(W/2,H/2,80,W/2,H/2,Math.max(W,H)*.75);
                fog.addColorStop(0,"rgba(0,0,0,0)"); fog.addColorStop(.45,"rgba(0,0,0,.04)"); fog.addColorStop(.75,"rgba(0,0,0,.18)"); fog.addColorStop(1,"rgba(0,0,0,.64)");
                ctx.fillStyle=fog; ctx.fillRect(0,0,W,H);
            }

            function drawGrave(g) {
                ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(g.rot); ctx.scale(g.scale,g.scale);
                ctx.fillStyle="rgba(0,0,0,.55)"; ctx.beginPath(); ctx.ellipse(0,12,31,9,0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle="#29221b"; ctx.beginPath(); ctx.ellipse(0,8,27,8,0,0,Math.PI*2); ctx.fill();
                const stone=ctx.createLinearGradient(-17,-35,18,12); stone.addColorStop(0,"#687069"); stone.addColorStop(.45,"#454c47"); stone.addColorStop(1,"#252b28");
                ctx.fillStyle=stone; ctx.beginPath(); ctx.moveTo(-17,10); ctx.lineTo(-17,-20); ctx.quadraticCurveTo(-17,-35,0,-37); ctx.quadraticCurveTo(17,-35,17,-20); ctx.lineTo(17,10); ctx.closePath(); ctx.fill();
                ctx.strokeStyle="rgba(150,160,150,.2)"; ctx.lineWidth=1; ctx.stroke();
                if(g.cross){ ctx.fillStyle="#1a211d"; ctx.fillRect(-3,-31,6,21); ctx.fillRect(-10,-25,20,6); }
                ctx.fillStyle="rgba(220,220,205,.55)"; ctx.font="bold 5px Arial"; ctx.textAlign="center"; ctx.fillText("R.I.P.",0,-5);
                if(g.cracked){ ctx.strokeStyle="rgba(10,15,12,.7)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-7,-26); ctx.lineTo(-2,-18); ctx.lineTo(-6,-10); ctx.lineTo(-3,-4); ctx.stroke(); }
                ctx.strokeStyle="rgba(75,105,66,.6)"; ctx.beginPath(); ctx.moveTo(-23,9); ctx.lineTo(-27,2); ctx.moveTo(23,9); ctx.lineTo(27,2); ctx.stroke();
                ctx.restore();
            }

            function drawDeadTree(x,y,s) {
                ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
                ctx.fillStyle="rgba(0,0,0,.5)"; ctx.beginPath(); ctx.ellipse(0,7,34,9,0,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle="#242924"; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(0,7); ctx.lineTo(-4,-68); ctx.stroke();
                ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-3,-25); ctx.lineTo(-33,-51); ctx.moveTo(-3,-42); ctx.lineTo(22,-66); ctx.moveTo(-2,-57); ctx.lineTo(-18,-80); ctx.moveTo(2,-30); ctx.lineTo(34,-45); ctx.stroke();
                ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-33,-51); ctx.lineTo(-43,-64); ctx.moveTo(22,-66); ctx.lineTo(32,-79); ctx.moveTo(-18,-80); ctx.lineTo(-25,-94); ctx.stroke();
                ctx.restore();
            }

            function drawFence(x,y,flip) {
                ctx.save(); ctx.translate(x,y); if(flip) ctx.scale(-1,1);
                ctx.strokeStyle="#292820"; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(0,10); ctx.lineTo(0,-32); ctx.stroke();
                ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-25,-20); ctx.lineTo(20,-16); ctx.moveTo(-22,-7); ctx.lineTo(18,-5); ctx.stroke();
                ctx.restore();
            }

            // Zombie creation & management
            function createZombieElement(z) {
                const container = document.getElementById('zombieContainer');
                const el = document.createElement('div');
                el.className = 'zombie-character';
                el.style.left = z.x + 'px';
                el.style.top = z.y + 'px';
                el.style.transform = `translate(-50%, -50%) scale(${z.r/23})`;
                if (z.type === 'runner') el.style.filter = "drop-shadow(0 20px 12px rgba(0,0,0,.7)) hue-rotate(45deg) brightness(1.1)";
                else if (z.type === 'tank') { el.style.filter = "drop-shadow(0 20px 12px rgba(0,0,0,.7)) saturate(1.3) brightness(.8)"; el.style.transform = `translate(-50%, -50%) scale(${z.r/23 * 1.3})`; }
                
                el.innerHTML = `
                    <div class="zombie-head">
                        <div class="zombie-scalp"></div>
                        <div class="zombie-wound w1"></div><div class="zombie-wound w2"></div><div class="zombie-wound w3"></div>
                        <div class="zombie-ear left"></div><div class="zombie-ear right"></div>
                        <div class="zombie-eye left"><div class="zombie-eyeball"><div class="zombie-pupil"></div></div></div>
                        <div class="zombie-eye right"><div class="zombie-eyeball"><div class="zombie-pupil"></div></div></div>
                        <div class="zombie-brow left"></div><div class="zombie-brow right"></div>
                        <div class="zombie-nose"></div>
                        <div class="zombie-mouth"><div class="zombie-tongue"></div>
                            <div class="zombie-tooth t1"></div><div class="zombie-tooth t2"></div><div class="zombie-tooth t3"></div>
                            <div class="zombie-tooth t4"></div><div class="zombie-tooth t5"></div><div class="zombie-tooth t6"></div>
                        </div>
                    </div>
                    <div class="zombie-neck"></div>
                    <div class="zombie-torso">
                        <div class="zombie-tear one"></div><div class="zombie-tear two"></div><div class="zombie-tear three"></div>
                        <div class="zombie-shirtBlood one"></div><div class="zombie-shirtBlood two"></div>
                        <div class="zombie-belt"><div class="zombie-buckle"></div></div>
                    </div>
                    <div class="zombie-arm left"><div class="zombie-hand"></div></div>
                    <div class="zombie-arm right"><div class="zombie-hand"></div></div>
                    <div class="zombie-leg left"><div class="zombie-shoe left"></div></div>
                    <div class="zombie-leg right"><div class="zombie-shoe right"></div></div>
                    <div class="zombie-word-label"><span class="typed"></span><span class="remaining"></span></div>
                `;
                container.appendChild(el);
                zombieElements.set(z, el);
                updateZombieLabel(z);
            }

            function updateZombieLabel(z) {
                const el = zombieElements.get(z);
                if (!el) return;
                const typedSpan = el.querySelector('.typed');
                const remainingSpan = el.querySelector('.remaining');
                typedSpan.textContent = z.typed || '';
                remainingSpan.textContent = z.word.substring(z.typed.length);
            }

            function updateZombieDepth() {
                const houseY = H / 2;
                zombies.forEach(z => {
                    if (z.dead) return;
                    const el = zombieElements.get(z);
                    if (!el) return;
                    if (z.y < houseY) { el.classList.add('behind-house'); el.classList.remove('front-house'); }
                    else { el.classList.add('front-house'); el.classList.remove('behind-house'); }
                });
            }

            function spawnZombie() {
                const side = Math.floor(Math.random()*4);
                let x, y;
                if (side === 0) { x = -60; y = Math.random()*H; }
                else if (side === 1) { x = W+60; y = Math.random()*H; }
                else if (side === 2) { x = Math.random()*W; y = -60; }
                else { x = Math.random()*W; y = H+60; }
                const baseSpeed = .20 + wave*.038;
                let speed = baseSpeed + Math.random()*.08;
                let type = 'normal';
                if (wave >= 4 && Math.random() < .15) type = 'runner';
                if (wave >= 7 && Math.random() < .10) type = 'tank';
                const z = { x, y, word: getWord(), typed: '', speed, type, dead: false, death: 0, hitFlash: 0, wobble: Math.random()*Math.PI*2 };
                if (type === 'normal') { z.r = 23; z.health = 1; }
                else if (type === 'runner') { z.r = 19; z.speed *= 1.30; z.health = 1; }
                else if (type === 'tank') { z.r = 31; z.speed *= .70; z.health = 2; }
                zombies.push(z);
                createZombieElement(z);
            }

            function killZombie(z) {
                if (!z || z.dead) return;
                if (z.type === 'tank' && z.health > 1) {
                    z.health--; z.hitFlash = 15; z.typed = '';
                    updateZombieLabel(z);
                    const el = zombieElements.get(z);
                    if (el) { el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'), 350); }
                    createExplosion(z.x, z.y, 18);
                    typing = ''; typingTarget = null; return;
                }
                z.dead = true; z.death = 0; z.typed = ''; kills++; score += z.type==='tank'?100:z.type==='runner'?50:25;
                const el = zombieElements.get(z);
                if (el) el.classList.add('dead');
                createExplosion(z.x, z.y, 30);
                for (let i=0;i<8;i++) bloodDrops.push({ x:z.x, y:z.y, vx:(Math.random()-.5)*2, vy:(Math.random()-.5)*2, life:30+Math.random()*30, size:2+Math.random()*4 });
                typing=''; typingTarget=null; updateHUD();
            }

            function createExplosion(x,y,amount){
                for(let i=0;i<amount;i++) particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:25+Math.random()*25,size:2+Math.random()*5});
            }

            // Typing logic
            function findMatchingZombies(text){ return zombies.filter(z=>!z.dead && z.word.startsWith(text)); }
            function closestMatch(matches){ let best=null,bestDist=Infinity; for(const z of matches){ const d=Math.hypot(z.x-player.x,z.y-player.y); if(d<bestDist){bestDist=d;best=z;} } return best; }
            function clearTypingMarks(){ zombies.forEach(z=>{ z.typed=''; updateZombieLabel(z); }); }

            window.addEventListener('keydown', function(e){
                if(!running || e.key.length!==1) return;
                const letter = e.key.toUpperCase();
                if(typing.length > 0){
                    const nextText = typing + letter;
                    const matches = findMatchingZombies(nextText);
                    if(matches.length > 0){
                        typing = nextText; typingTarget = closestMatch(matches);
                        if(typingTarget){ typingTarget.typed=typing; updateZombieLabel(typingTarget); }
                        if(typingTarget && typing === typingTarget.word){ killZombie(typingTarget); typing=''; typingTarget=null; wordsCompleted++; }
                        updateTypingFlash(); return;
                    }
                    const fresh = findMatchingZombies(letter);
                    if(fresh.length > 0){ clearTypingMarks(); typing=letter; typingTarget=closestMatch(fresh); if(typingTarget){typingTarget.typed=typing; updateZombieLabel(typingTarget);} updateTypingFlash(); }
                    return;
                }
                const matches = findMatchingZombies(letter);
                if(matches.length === 0) return;
                typing = letter; typingTarget = closestMatch(matches);
                if(typingTarget){ typingTarget.typed=typing; updateZombieLabel(typingTarget); }
                if(typingTarget && typingTarget.word === typing){ killZombie(typingTarget); typing=''; typingTarget=null; wordsCompleted++; }
                updateTypingFlash();
            });

            function updateTypingFlash(){
                const el=document.getElementById('typingFlash');
                if(typingTarget && typing.length>0){ el.textContent=typingTarget.word; el.style.opacity='1'; clearTimeout(updateTypingFlash.timer); updateTypingFlash.timer=setTimeout(()=>el.style.opacity='0',350); }
            }

            function updateHUD(){
                if(!player) return;
                document.getElementById('health').style.width = Math.max(0,player.health)+'%';
                document.getElementById('wave').textContent = wave;
                document.getElementById('kills').textContent = kills;
                document.getElementById('score').textContent = score;
            }

            function resetPlayer(){ player={x:W/2,y:H/2,r:20,health:100,maxHealth:100}; }

            function resetGame(){
                resetPlayer(); zombies=[]; particles=[]; bloodDrops=[]; wave=1; kills=0; score=0;
                waveTimer=0; spawnTimer=0; typing=''; typingTarget=null; wordsCompleted=0; wpm=0; wpmStartTime=performance.now();
                document.getElementById('wpmDisplay').textContent='0';
                document.getElementById('zombieContainer').innerHTML=''; zombieElements.clear(); updateHUD();
            }

            function gameOver(){
                running=false; typing=''; typingTarget=null; clearTypingMarks();
                document.querySelector('#screen h1').textContent='YOU DIED';
                document.querySelector('#screen p').innerHTML=`You survived until <b>Wave ${wave}</b><br>☠️ Kills: <b>${kills}</b><br>⭐ Score: <b>${score}</b><br>⚡ WPM: <b>${wpm}</b>`;
                document.getElementById('start').textContent='PLAY AGAIN';
                document.getElementById('screen').style.display='flex';
            }

            // Game loop
            function update(dt){
                if(!running) return;
                spawnTimer -= dt;
                const maxZombies = Math.min(2 + Math.floor(wave*.75), 14);
                const alive = zombies.filter(z=>!z.dead).length;
                if(spawnTimer <= 0 && alive < maxZombies){ spawnZombie(); spawnTimer = Math.max(32 - wave*1.25, 10); }
                waveTimer += dt;
                if(waveTimer >= 1500){ wave++; waveTimer=0; score += wave*25; createWaveText(); updateHUD(); }
                for(let i=zombies.length-1;i>=0;i--){
                    const z=zombies[i];
                    if(z.dead){ z.death+=dt; z.r*=.94; if(z.death>60){ const el=zombieElements.get(z); if(el) el.remove(); zombieElements.delete(z); zombies.splice(i,1); } continue; }
                    const dx=player.x-z.x, dy=player.y-z.y, dist=Math.hypot(dx,dy);
                    if(dist > player.r + z.r){
                        z.x += (dx/dist)*z.speed*dt; z.y += (dy/dist)*z.speed*dt;
                        const el=zombieElements.get(z); if(el){ el.style.left=z.x+'px'; el.style.top=z.y+'px'; }
                    } else {
                        const damage = z.type==='tank'?.045:z.type==='runner'?.030:.025;
                        player.health -= damage*dt;
                        if(player.health <= 0){ player.health=0; updateHUD(); gameOver(); return; }
                    }
                    z.wobble += .04*dt; if(z.hitFlash>0) z.hitFlash-=dt;
                }
                updateZombieDepth();
                for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0) particles.splice(i,1); }
                for(let i=bloodDrops.length-1;i>=0;i--){ const b=bloodDrops[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; if(b.life<=0) bloodDrops.splice(i,1); }
                const now=performance.now(); const elapsed=(now-wpmStartTime)/1000;
                if(elapsed>=1){ wpm=Math.round((wordsCompleted/elapsed)*60); document.getElementById('wpmDisplay').textContent=wpm; }
                updateHUD();
            }

            function drawParticles(){ for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life/45); ctx.fillStyle='#c92b2b'; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; }
            function drawBloodDrops(){ for(const b of bloodDrops){ ctx.globalAlpha=Math.max(0,b.life/60); ctx.fillStyle='#861515'; ctx.beginPath(); ctx.arc(b.x,b.y,b.size,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; }

            let waveMessage='', waveMessageTimer=0;
            function createWaveText(){ waveMessage='WAVE '+wave+' APPROACHING'; waveMessageTimer=120; }
            function updateWaveMessage(dt){ if(waveMessageTimer>0) waveMessageTimer-=dt; }
            function drawWaveMessage(){ if(waveMessageTimer<=0) return; ctx.save(); ctx.globalAlpha=Math.min(1,waveMessageTimer/30); ctx.textAlign='center'; ctx.font='bold 42px Arial'; ctx.fillStyle='#e33'; ctx.shadowColor='#900'; ctx.shadowBlur=20; ctx.fillText(waveMessage,W/2,100); ctx.restore(); }

            function gameLoop(time){
                if(!running) return;
                let dt=(time-lastTime)/16.67; dt=Math.min(dt,2); lastTime=time;
                update(dt); updateWaveMessage(dt);
                drawBackground(); drawBloodDrops(); drawParticles(); drawWaveMessage();
                const gradient=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.18,W/2,H/2,Math.max(W,H)*.76);
                gradient.addColorStop(0,'rgba(0,0,0,0)'); gradient.addColorStop(.6,'rgba(0,0,0,.05)'); gradient.addColorStop(1,'rgba(0,0,0,.72)');
                ctx.fillStyle=gradient; ctx.fillRect(0,0,W,H);
                requestAnimationFrame(gameLoop);
            }

            document.getElementById('start').onclick = function(){
                resetGame();
                document.querySelector('#screen h1').textContent='ZOMBIE SURVIVAL';
                document.querySelector('#screen p').innerHTML='🧟 Zombies are coming...<br>Type any word you see above a zombie<br>and kill it.';
                document.getElementById('start').textContent='START SURVIVAL';
                document.getElementById('screen').style.display='none';
                running=true; lastTime=performance.now(); wpmStartTime=performance.now(); wordsCompleted=0;
                document.getElementById('wpmDisplay').textContent='0';
                requestAnimationFrame(gameLoop);
            };

            // Initial draw
            resetGame();
            drawBackground();
        })();
    </script>
